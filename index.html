<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">

  <title>EURO FOOTBALL PORTAL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
      background: #f4f5f7;
      color: #111827;
    }

    .topbar {
      background: #111827;
      color: white;
      padding:
        calc(32px + env(safe-area-inset-top))
        20px
        24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .eyebrow {
      color: #c7cbd4;
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 7px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.12;
    }

    .iconbtn {
      width: 52px;
      height: 52px;
      border: 0;
      border-radius: 50%;
      background: #303747;
      color: white;
      font-size: 28px;
    }

    main {
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    .hero {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .heroTitle {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .muted {
      color: #8b93a3;
      font-size: 13px;
    }

    .search {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      border: 1px solid #d5d8df;
      border-radius: 16px;
      font-size: 16px;
      background: #f3f4f6;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 16px 0;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter {
      flex: 0 0 auto;
      border: 1px solid #d5d8df;
      background: white;
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 700;
    }

    .filter.active {
      background: #111827;
      color: white;
      border-color: #111827;
    }

    .sectionHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 2px;
    }

    .sectionHead h2 {
      font-size: 23px;
      margin: 0;
    }

    .news {
      display: grid;
      gap: 14px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 19px;
      box-shadow: 0 4px 16px rgba(0,0,0,.04);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      font-size: 12px;
      color: #7b8494;
      margin-bottom: 10px;
    }

    .badge {
      background: #e8ebf0;
      color: #111827;
      border-radius: 999px;
      padding: 5px 9px;
      font-weight: 700;
    }

    .star {
      font-weight: 700;
    }

    .card h3 {
      margin: 0 0 10px;
      line-height: 1.45;
      font-size: 19px;
    }

    .card p {
      margin: 0 0 15px;
      color: #555e6c;
      line-height: 1.7;
      font-size: 14px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 14px;
    }

    .actionButton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    .translateButton {
      background: #111827;
      color: white;
    }

    .originalButton {
      border: 1px solid #d5d8df;
      background: white;
      color: #374151;
    }

    .translateNote {
      margin-top: 10px;
      color: #9aa1af;
      font-size: 11px;
      line-height: 1.5;
    }

    .empty {
      background: white;
      padding: 24px;
      border-radius: 18px;
      color: #7b8494;
    }

    footer {
      padding: 28px 24px calc(34px + env(safe-area-inset-bottom));
      color: #9aa1af;
      font-size: 11px;
      line-height: 1.6;
      max-width: 900px;
      margin: 0 auto;
    }
  </style>
</head>

<body>

<header class="topbar">
  <div>
    <div class="eyebrow">EUROPEAN FOOTBALL</div>
    <h1>EURO FOOTBALL<br>PORTAL</h1>
  </div>

  <button id="refreshBtn" class="iconbtn" aria-label="更新">
    ↻
  </button>
</header>

<main>

  <section class="hero">
    <div class="heroTitle">欧州サッカー最新動向</div>

    <div id="updatedAt" class="muted">
      データ読み込み中…
    </div>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="ニュースを検索（選手・クラブ・大会・移籍など）"
    >
  </section>

  <nav id="filters" class="filters"></nav>

  <section>
    <div class="sectionHead">
      <h2>最新ニュース</h2>
      <span id="count" class="muted"></span>
    </div>

    <div id="news" class="news"></div>
  </section>

</main>

<footer>
  ニュース一覧は無料ソースから取得しています。
  「日本語で詳しく読む」は元記事を翻訳表示します。
  翻訳表示に対応していない媒体では「原文を見る」を利用してください。
</footer>

<script>
const DATA_URL = "./data/news.json";

let allNews = [];
let activeFilter = "all";

const categories = [
  ["all", "すべて"],
  ["ucl", "CL"],
  ["epl", "プレミア"],
  ["laliga", "ラ・リーガ"],
  ["seriea", "セリエA"],
  ["bundesliga", "ブンデス"],
  ["transfer", "移籍"],
  ["other", "その他"]
];

function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value == null ? "" : String(value);
  return div.innerHTML;
}

function googleTranslateUrl(originalUrl) {
  if (!originalUrl) return "#";

  return (
    "https://translate.google.com/translate" +
    "?sl=auto" +
    "&tl=ja" +
    "&u=" +
    encodeURIComponent(originalUrl)
  );
}

function renderFilters() {
  const filters = document.getElementById("filters");

  filters.innerHTML = categories.map(([id, label]) => `
    <button
      class="filter ${id === activeFilter ? "active" : ""}"
      data-filter="${id}">
      ${label}
    </button>
  `).join("");

  filters.querySelectorAll(".filter").forEach(button => {
    button.addEventListener("click", () => {
      activeFilter = button.dataset.filter;
      renderFilters();
      renderNews();
    });
  });
}

function renderNews() {
  const newsEl = document.getElementById("news");
  const countEl = document.getElementById("count");
  const searchEl = document.getElementById("search");

  const query = searchEl.value.trim().toLowerCase();

  const filtered = allNews.filter(item => {
    const categoryMatch =
      activeFilter === "all" ||
      item.category === activeFilter ||
      item.type === activeFilter;

    const text = [
      item.title,
      item.summary,
      item.source,
      item.label,
      item.category,
      item.type,
      item.title_original,
      item.summary_original
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

    return categoryMatch && (!query || text.includes(query));
  });

  countEl.textContent = filtered.length + "件";

  if (!filtered.length) {
    newsEl.innerHTML =
      '<div class="empty">該当するニュースがありません。</div>';
    return;
  }

  newsEl.innerHTML = filtered.map(item => {
    let dateText = "";

    if (item.published) {
      const date = new Date(item.published);

      dateText = Number.isNaN(date.getTime())
        ? item.published
        : date.toLocaleString("ja-JP");
    }

    const originalUrl = item.url || "";
    const translatedUrl = googleTranslateUrl(originalUrl);

    return `
      <article class="card">

        <div class="meta">

          ${item.label
            ? `<span class="badge">${escapeHtml(item.label)}</span>`
            : ""}

          ${item.featured
            ? `<span class="star">★ 注目</span>`
            : ""}

          ${item.source
            ? `<span>${escapeHtml(item.source)}</span>`
            : ""}

          ${dateText
            ? `<span>${escapeHtml(dateText)}</span>`
            : ""}

        </div>

        <h3>${escapeHtml(item.title || "タイトルなし")}</h3>

        ${item.summary
          ? `<p>${escapeHtml(item.summary)}</p>`
          : ""}

        ${
          originalUrl
            ? `
              <div class="actions">

                <a
                  class="actionButton translateButton"
                  href="${escapeHtml(translatedUrl)}"
                  target="_blank"
                  rel="noopener noreferrer">
                  🇯🇵 日本語で詳しく読む
                </a>

                <a
                  class="actionButton originalButton"
                  href="${escapeHtml(originalUrl)}"
                  target="_blank"
                  rel="noopener noreferrer">
                  原文を見る ↗
                </a>

              </div>

              <div class="translateNote">
                翻訳ページが開けない場合は原文をご利用ください。
              </div>
            `
            : ""
        }

      </article>
    `;
  }).join("");
}

async function loadNews() {
  const updatedAt =
    document.getElementById("updatedAt");

  const newsEl =
    document.getElementById("news");

  updatedAt.textContent =
    "データ読み込み中…";

  try {
    const response = await fetch(
      DATA_URL + "?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    const data =
      await response.json();

    allNews =
      Array.isArray(data.items)
        ? data.items
        : [];

    if (data.updated_at) {
      const date =
        new Date(data.updated_at);

      updatedAt.textContent =
        Number.isNaN(date.getTime())
          ? "最終更新: " + data.updated_at
          : "最終更新: " +
            date.toLocaleString("ja-JP");
    } else {
      updatedAt.textContent =
        allNews.length +
        "件のニュースを取得";
    }

    renderNews();

  } catch (error) {
    console.error(error);

    updatedAt.textContent =
      "ニュースの読み込みに失敗しました";

    newsEl.innerHTML =
      '<div class="empty">データを取得できませんでした。</div>';
  }
}

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderNews
  );

document
  .getElementById("refreshBtn")
  .addEventListener(
    "click",
    loadNews
  );

renderFilters();
loadNews();

setInterval(
  loadNews,
  15 * 60 * 1000
);
</script>

</body>
</html>
